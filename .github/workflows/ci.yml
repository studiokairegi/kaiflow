name: CI

# Runs on every pull request and on every push to main.
# To make this a deploy gate: GitHub -> Settings -> Branches -> protect `main` -> require the
# status check named "CI" (the final job below) and require pull requests before merging.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Stub values so the production build never needs real secrets.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-stub-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (errors fail, warnings are reported)
        run: npm run lint
      - name: Type check (fails only on NEW type errors)
        run: npm run typecheck
      - name: Existing test suite (node:test)
        run: npm test
      - name: Component tests (Vitest)
        run: npm run test:unit
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright (builds against a stub backend; no real network)
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  worker:
    name: Python worker tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: intelligence-worker/requirements-dev.txt
      - run: pip install -r intelligence-worker/requirements-dev.txt
      - run: python -m pytest
        working-directory: intelligence-worker

  # Single required check for branch protection. Fails if any job above failed or was cancelled.
  ci:
    name: CI
    if: always()
    needs: [verify, e2e, worker]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo "verify=${{ needs.verify.result }} e2e=${{ needs.e2e.result }} worker=${{ needs.worker.result }}"
          test "${{ needs.verify.result }}" = "success" && test "${{ needs.e2e.result }}" = "success" && test "${{ needs.worker.result }}" = "success"
